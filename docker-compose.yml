# AskSQL 编排：api（+ 可选 Caddy）。
#
# 中间件说明（重要）：FalkorDB 复用宿主机上已在运行的实例，不在此编排内。
# 宿主机 .env 里的 FALKORDB_URL 指向它（如 falkor://<主机IP>:6379）。
#
# 镜像策略：image + build 同时声明。
#   本地开发：docker compose up -d          → 从源码构建
#   云主机部署：IMAGE_TAG=<git sha> docker compose up -d  → 拉取 ghcr 预构建镜像

services:
  api:
    image: ghcr.io/emoduck888/asksql-api:${IMAGE_TAG:-latest}
    build: .
    ports:
      - "8065:8065"
    env_file: .env
    # 让容器能访问「宿主机」上运行的 FalkorDB（Linux 下 host.docker.internal
    # 默认不存在，host-gateway 映射到宿主机网关）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # SQLite 管理库持久化；容器内默认路径即包目录下的 data/manage.db
      - manage_data:/app/backend/src/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8065/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s   # 首次启动要跑迁移 + 冷启动，放宽一点

  # 反代 + 自动 HTTPS。域名未就绪前不起用：
  #   启用：docker compose --profile web up -d
  #   前提：DNS A 记录指向本机 + 防火墙放行 80/443 + .env 里 DOMAIN=你的域名
  caddy:
    image: caddy:2
    profiles: ["web"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 不设 DOMAIN 也不影响本地开发（caddy 在 profile 里默认不起）；
      # 起 --profile web 时必须在 .env 里配 DOMAIN，否则 Caddy 启动即报错
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  manage_data:
  caddy_data:
  caddy_config:
