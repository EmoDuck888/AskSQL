[project]
name = "nl2sql"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13,<3.14"
dependencies = [
    "deepagents>=0.5.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "fastmcp>=3.2.4",
    "langchain-community>=0.4.1",
    "langchain-deepseek>=1.0.1",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-pymupdf4llm>=0.5.0",
    "langgraph-cli[inmem]>=0.4.24",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "aiofiles>=24.1.0",
    "asyncpg>=0.30.0",
    "falkordb>=1.0.0",
    "graphiti-core>=0.29.1",
    "redis>=5.0.0",
    "cryptography>=44.0.0",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.10",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "psycopg-pool>=3.3.1",
    "pyhive>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# app 包在 backend/src/ 下，pytest 不会自动加进 sys.path（start_api.py:28-31 是手动加的）
pythonpath = ["backend/src"]
# 只在这些目录里找测试，避免去爬 .venv / node_modules / langgraph_* 残留副本
testpaths = ["tests"]
