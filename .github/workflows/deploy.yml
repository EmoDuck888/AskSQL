name: deploy

on:
  push:
    branches: [main]

env:
  # ghcr 命名空间 = GitHub 用户名/组织名，镜像名随意但要和 compose 里一致
  IMAGE: ghcr.io/${{ github.repository_owner }}/asksql-api

jobs:
  # 第一节：体检。测试不过，后面都不跑。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: v2   # 失败任务也会存缓存；换 key 防止坏缓存被后续运行恢复
      - run: uv --version    # 排障用：锁文件校验与 uv 版本相关
      - run: uv sync --frozen --dev
      - run: uv run pytest -q

  # 第二节：构建不可变镜像并推 ghcr。tag = git sha，「线上跑的是哪份代码」永远可查。
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推 ghcr 必需
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 不用 docker/build-push-action：该 action 在本仓库环境下秒挂（原因待查），
      # 等价的 buildx CLI 更透明，报错也更好读
      - name: Build and push image
        run: |
          docker buildx build --push \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

  # 第三节：SSH 上云主机拉取指定 sha 的镜像并重启。
  # 回滚 = 重新跑一次 workflow（Run workflow 选旧 commit），
  # 或手动在主机上 IMAGE_TAG=<上一个 sha> docker compose up -d。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/asksql
            git pull
            IMAGE_TAG=${{ github.sha }} docker compose pull
            IMAGE_TAG=${{ github.sha }} docker compose up -d --wait
